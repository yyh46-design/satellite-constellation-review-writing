<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34536b"/></marker></defs>
<rect width="1000" height="720" fill="white"/>
<g font-family="Microsoft YaHei, SimSun, sans-serif" fill="#172b3b">
<text x="30" y="35" font-size="30" font-weight="bold">决策范围：哪些选择仍能被改变？</text>
<rect x="24" y="52" width="952" height="137" rx="10" fill="#f1f5f8" stroke="#8ca2b4"/>
<text x="44" y="84" font-size="28" font-weight="bold">A 共同选择：下游条件参与本轮上游选择 [16][11]</text>
<rect x="76" y="98" width="340" height="44" rx="6" fill="white" stroke="#34536b"/>
<rect x="568" y="98" width="340" height="44" rx="6" fill="white" stroke="#34536b"/>
<text x="246" y="128" text-anchor="middle" font-size="26">采集节点／窗口可改</text>
<text x="738" y="128" text-anchor="middle" font-size="26">交付路径／容量约束</text>
<path d="M430 120 H553" stroke="#34536b" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="46" y="174" font-size="25">可分解求解；下游结果仍影响候选评价与接受。</text>
<rect x="24" y="201" width="952" height="137" rx="10" fill="#f8f6f0" stroke="#b3a887"/>
<text x="44" y="232" font-size="28" font-weight="bold">B 顺序配置：本轮上游固定，优化下游 [47]</text>
<rect x="76" y="246" width="340" height="44" rx="6" fill="#eeeae0" stroke="#706b5a"/>
<rect x="568" y="246" width="340" height="44" rx="6" fill="white" stroke="#34536b"/>
<text x="246" y="276" text-anchor="middle" font-size="26">已确定的本轮采集</text>
<text x="738" y="276" text-anchor="middle" font-size="26">处理负载／频率可改</text>
<path d="M430 269 H553" stroke="#34536b" stroke-width="3" marker-end="url(#arr)"/>
<text x="46" y="322" font-size="25">下游仍可含联合子问题；质量反馈可进入下一轮。</text>
<rect x="24" y="350" width="952" height="137" rx="10" fill="#f1f7f3" stroke="#8ba996"/>
<text x="44" y="382" font-size="28" font-weight="bold">C 有限反馈：仅修改仍有权限且来得及生效的活动</text>
<rect x="76" y="396" width="340" height="44" rx="6" fill="white" stroke="#34536b"/>
<rect x="568" y="396" width="340" height="44" rx="6" fill="white" stroke="#34536b"/>
<text x="246" y="426" text-anchor="middle" font-size="26">确认连接不可用</text>
<text x="738" y="426" text-anchor="middle" font-size="26">后续传输局部绕行</text>
<path d="M430 419 H553" stroke="#34536b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr)"/>
<text x="46" y="472" font-size="25">例如 [11] 保留既有采集分配；不自动扩大为全局重算。</text>
<text x="30" y="530" font-size="29" font-weight="bold">生效时序：新安排是否赶得上剩余窗口？</text>
<g fill="white" stroke="#34536b"><rect x="35" y="547" width="207" height="53" rx="6"/><rect x="275" y="547" width="207" height="53" rx="6"/><rect x="515" y="547" width="207" height="53" rx="6"/><rect x="755" y="547" width="207" height="53" rx="6"/></g>
<g font-size="26" text-anchor="middle"><text x="138" y="581">状态确认</text><text x="378" y="581">求解与检查</text><text x="618" y="581">协调确认</text><text x="858" y="581">配置生效</text></g>
<g fill="none" stroke="#34536b" stroke-width="2.5" marker-end="url(#arr)"><path d="M244 572 H269"/><path d="M484 572 H509"/><path d="M724 572 H749"/></g>
<path d="M38 628 H961" stroke="#34536b" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="499" y="659" text-anchor="middle" font-size="25">还需保留执行活动的可用窗口与既有资源承诺</text>
<text x="30" y="696" font-size="22" fill="#465665">本文归纳的比较框架；三个示例来自不同研究，非共同实验或统一实现。</text>
</g></svg>
